services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: financify
      POSTGRES_USER: financify
      POSTGRES_PASSWORD: financify
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financify -d financify"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
